<!DOCTYPE html>
<html>
<head>
    <title>Error</title>
    <style>
        body {
            background-color: #0a0a0a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
        }

        h1 {
            color: #a020f0;
            text-align: center;
            font-size: 3em;
            margin-bottom: 20px;
            text-shadow: 2px 2px #00ff00;
        }

        a.add-btn {
            display: inline-block;
            background-color: #a020f0;
            color: #ffffff;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            text-decoration: none;
            margin-top: 20px;
        }

        a.add-btn:hover {
            background-color: #00ff00;
            color: #000000;
        }

        .alert-danger {
            background-color: #ff4d6d;
            color: #ffffff;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

<h1>Error</h1>

<div class="alert-danger" th:text="${errorMessage}"></div>

<a href="/" class="add-btn">Return to Menu</a>

</body>
</html>
