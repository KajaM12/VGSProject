<!-- Lets create a purple, black, and green video game collection theme to make it more entertaining -->

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Game Collection</title>
    <style>
        body {
            background-color: #0a0a0a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
        }

        h1 {
            color: #a020f0;
            text-align: center;
            font-size: 3em;
            margin-bottom: 20px;
            text-shadow: 2px 2px #00ff00;
        }

        a {
            color: #00ff00;
            text-decoration: none;
            font-weight: bold;
            margin-right: 10px;
        }

        a:hover {
            color: #a020f0;
            text-shadow: 1px 1px #ffffff;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background-color: #1a1a1a;
            border-radius: 10px;
            overflow: hidden;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #444;
        }

        th {
            background-color: #3d0075;
            color: #00ff00;
        }

        tr:hover {
            background-color: #2e2e2e;
        }

        .alert {
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 8px;
            font-weight: bold;
        }

        .alert-danger {
            background-color: #ff4d6d;
            color: #ffffff;
        }

        .alert-success {
            background-color: #00ff7f;
            color: #000000;
        }

        .add-btn {
            display: inline-block;
            background-color: #a020f0;
            color: #ffffff;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            text-decoration: none;
            margin-bottom: 15px;
        }

        .add-btn:hover {
            background-color: #00ff00;
            color: #000000;
        }

        .action-link {
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: bold;
        }

        .action-link.delete {
            background-color: #ff4d6d;
            color: #fff;
        }

        .action-link.complete {
            background-color: #00ff7f;
            color: #000;
        }

        .action-link.update {
            background-color: #a020f0;
            color: #fff;
        }

        .action-link:hover {
            opacity: 0.8;
        }
    </style>
</head>
<body>

<h1>Game Collection</h1>

<!-- Messages -->
<div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
<div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>

<!-- Add game link -->
<a href="/add" class="add-btn">Add Game</a>

<!-- Empty database message -->
<p th:if="${#lists.isEmpty(games)}">No games found in the database.</p>

<!-- Game table -->
<table th:if="${!#lists.isEmpty(games)}">
    <tr>
        <th>ID</th>
        <th>Title</th>
        <th>Genre</th>
        <th>Platform</th>
        <th>Completed</th>
        <th>Actions</th>
    </tr>

    <tr th:each="game : ${games}">
        <td th:text="${game.id}"></td>
        <td th:text="${game.title}"></td>
        <td th:text="${game.genre}"></td>
        <td th:text="${game.platform}"></td>
        <td>
            <span th:if="${game.completed}" style="color:#00ff00;">Completed</span>
            <span th:unless="${game.completed}" style="color:#ff4d6d;">Not Completed</span>
        </td>
        <td>
            <a th:href="@{/delete/{id}(id=${game.id})}" class="action-link delete"
               onclick="return confirm('Are you sure you want to delete this game?');">Delete</a>
            <a th:href="@{/complete/{id}(id=${game.id})}" class="action-link complete">Complete</a>
            <a th:href="@{/update/{id}(id=${game.id})}" class="action-link update">Update</a>
        </td>
    </tr>

</table>

<!-- Exit button -->
<a href="/exit" class="add-btn" style="background-color:#ff0000;">Exit</a>

</body>
</html>
