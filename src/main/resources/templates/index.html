<!-- Lets create a purple, black, and green video game collection theme to make it more entertaining -->

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Game Collection</title>
    <style>
        body {
            background-color: #0a0a0a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
        }

        h1 {
            color: #a020f0;
            text-align: center;
            font-size: 3em;
            margin-bottom: 20px;
            text-shadow: 2px 2px #00ff00;
        }

        a {
            color: #00ff00;
            text-decoration: none;
            font-weight: bold;
            margin-right: 10px;
        }

        a:hover {
            color: #a020f0;
            text-shadow: 1px 1px #ffffff;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background-color: #1a1a1a;
            border-radius: 10px;
            overflow: hidden;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #444;
        }

        th {
            background-color: #3d0075;
            color: #00ff00;
        }

        tr:hover {
            background-color: #2e2e2e;
        }

        .selected-row {
            background-color: #333 !important;
        }

        .alert {
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 8px;
            font-weight: bold;
        }

        .alert-danger {
            background-color: #ff4d6d;
            color: #ffffff;
        }

        .alert-success {
            background-color: #00ff7f;
            color: #000000;
        }

        .btn {
            display: inline-block;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            margin-right: 10px;
        }

        .add-btn {
            background-color: #a020f0;
            color: #ffffff;
        }

        .delete-btn {
            background-color: #ff4d6d;
            color: #fff;
        }

        .update-btn {
            background-color: #a020f0;
            color: #fff;
        }

        .complete-btn {
            background-color: #00ff7f;
            color: #000;
        }

        .btn:hover {
            opacity: 0.8;
        }
    </style>
</head>
<body>

<h1>Game Collection</h1>

<!-- Messages -->
<div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
<div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>

<!-- Add game -->
<a href="/add" class="btn add-btn">Add Game</a>

<!-- Form wraps table + buttons -->
<form method="post">

    <!-- Action Buttons -->
    <div style="margin-top:15px;">
        <button type="submit" formaction="/delete" class="btn delete-btn"
                onclick="return confirm('Delete selected game?')">Delete</button>

        <button type="submit" formaction="/show-update" class="btn update-btn">Update</button>

        <button type="submit" formaction="/complete" class="btn complete-btn">Mark Complete</button>
    </div>

    <!-- Empty message -->
    <p th:if="${#lists.isEmpty(games)}">No games found in the database.</p>

    <!-- Game table -->
    <table th:if="${!#lists.isEmpty(games)}">
        <tr>
            <th>Select</th>
            <th>ID</th>
            <th>Title</th>
            <th>Genre</th>
            <th>Platform</th>
            <th>Completed</th>
        </tr>

        <tr th:each="game : ${games}" onclick="selectRow(this)">
            <td>
                <input type="radio" name="selectedId" th:value="${game.id}">
            </td>
            <td th:text="${game.id}"></td>
            <td th:text="${game.title}"></td>
            <td th:text="${game.genre}"></td>
            <td th:text="${game.platform}"></td>
            <td>
                <span th:if="${game.completed}" style="color:#00ff00;">Completed</span>
                <span th:unless="${game.completed}" style="color:#ff4d6d;">Not Completed</span>
            </td>
        </tr>
    </table>

</form>

<!-- Exit -->
<a href="/exit" class="btn" style="background-color:#ff0000;">Exit</a>

<!-- Row selection highlight -->
<script>
    function selectRow(row) {
        // Remove highlight from all rows
        document.querySelectorAll("tr").forEach(r => r.classList.remove("selected-row"));

        // Highlight clicked row
        row.classList.add("selected-row");

        // Select radio button inside row
        const radio = row.querySelector("input[type='radio']");
        if (radio) radio.checked = true;
    }
</script>

</body>
</html>
