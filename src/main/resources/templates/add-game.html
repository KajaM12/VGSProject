<!DOCTYPE html>
<html>
<head>
    <title>Add Game</title>
    <style>
        body {
            background-color: #0a0a0a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
        }

        h1 {
            color: #a020f0;
            text-align: center;
            font-size: 3em;
            margin-bottom: 20px;
            text-shadow: 2px 2px #00ff00;
        }

        form {
            max-width: 400px;
            margin: auto;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input[type="text"],
        input[type="number"] {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border-radius: 6px;
            border: 1px solid #444;
            background-color: #1a1a1a;
            color: #ffffff;
        }

        button.add-btn {
            display: inline-block;
            background-color: #a020f0;
            color: #ffffff;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            text-decoration: none;
            margin-top: 20px;
        }

        button.add-btn:hover {
            background-color: #00ff00;
            color: #000000;
        }

        a.back-btn {
            display: inline-block;
            background-color: #ff0000;
            color: #ffffff;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            margin-top: 15px;
        }

        a.back-btn:hover {
            background-color: #00ff00;
            color: #000000;
        }

        .alert-danger {
            background-color: #ff4d6d;
            color: #ffffff;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 15px;
        }

        .alert-success {
            background-color: #00ff7f;
            color: #000000;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

<h1>Add Game</h1>

<!-- Messages -->
<div th:if="${errorMessage}" class="alert-danger" th:text="${errorMessage}"></div>
<div th:if="${successMessage}" class="alert-success" th:text="${successMessage}"></div>

<form action="/add" method="post">
    <label for="id">ID:</label>
    <input type="number" id="id" name="id" required>

    <label for="title">Title:</label>
    <input type="text" id="title" name="title" required>

    <label for="genre">Genre:</label>
    <input type="text" id="genre" name="genre" required>

    <label for="platform">Platform:</label>
    <input type="text" id="platform" name="platform" required>

    <button type="submit" class="add-btn">Add Game</button>
</form>

<a href="/" class="back-btn">Back</a>

</body>
</html>
